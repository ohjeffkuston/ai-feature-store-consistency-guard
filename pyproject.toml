[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-feature-store-consistency-guard"
version = "1.0.0"
description = "Deterministic promotion controls for online/offline ML feature consistency"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
feature-consistency-guard = "feature_consistency_guard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
