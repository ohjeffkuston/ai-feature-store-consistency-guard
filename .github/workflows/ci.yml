name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: feature-consistency-guard samples/compliant-contract.yaml
      - run: python -m json.tool policy/feature-consistency-policy.json >/dev/null
